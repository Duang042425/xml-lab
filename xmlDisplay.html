<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Book Catalogue(XML Lab)</title>
        <style>
            .book-item{border:1px solid #ccc;padding:12px;margin:8px 0;max-width:600px;}
        </style>
    </head>
    <body>
        <h1>Book Catalogue</h1>
        <div id="bookContainer"></div>

        <script>
            const container = document.getElementById("bookContainer");
            
            fetch("book.xml")
            .then(response=>{
                if(!response.ok){
                    throw new Error("Fetch error: " + response.status);
                }
                return response.text();
            })
            .then(xmlText=>{

                const parser = new DOMParser();
                const xmlDoc = parser.parseFromString(xmlText,'text/xml');

                //get book
                const bookList = xmlDoc.querySelectorAll("book");

                bookList.forEach(book=>{
                    const id = book.getAttribute("id");
                    const title = book.querySelector("title").textContent;
                    const author = book.querySelector("author").textContent;
                    const price = book.querySelector("price").textContent;

                    const div = document.createElement("div");
                    div.className = "book-item";
                    div.innerHTML =`
                    <p><strong>Book ID:</strong>${id}</p>
                    <p><strong>title:</strong>${title}</p>
                    <p><strong>author:</strong>${author}</p>
                    <p><strong>price:</strong>${price}</p>
                    `;
                    container.appendChild(div);
                })
            })
            .catch(err=>{
                console.error('Fetch error: ' + err.message);
                container.innerHTML = `<p>Load XML failed: ${err.message}</p>`;
            
            })
        </script>
    </body>
</html>
